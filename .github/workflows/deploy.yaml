name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Triggers the workflow every time code is pushed to main

# Set permissions for the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued run.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs: 
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # cache: 'npm'

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Build the Vite static site
      - name: Build Project
        run: npm run build

      # # Step 5: Configure GitHub Pages artifact options
      # - name: Setup Pages
      #   uses: actions/configure-pages@v5

      # # Step 6: Upload built static files (dist folder) as an artifact
      # - name: Upload Artifact
      #   uses: actions/upload-pages-artifact@v3
      #   with:
      #     path: './dist' # Vite outputs build files to 'dist' by default

      # # Step 7: Deploy the artifact to GitHub Pages
      # - name: Deploy to GitHub Pages
      #   id: deployment
      #   uses: actions/deploy-pages@v4

      # Step 5: Deploy to GH Pages
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with: 
          folder: dist
          branch: gh-pages